version: 2

project_name: bashcoat

builds:
  - id: bashcoat
    main: ./cmd/bashcoat
    binary: bashcoat
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/noissefnoc/bashcoat/internal/cli.Version={{.Tag}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^chore\\("
      - "^ci:"
      - "^Merge pull request"
      - "^Merge branch"
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: Dependencies
      regexp: '^fix\(deps\):'
      order: 3
    - title: Bug Fixes
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: Performance & Refactoring
      regexp: '^(perf|refactor)(\(.+\))?:'
      order: 2
    - title: Others
      order: 999

release:
  github:
    owner: noissefnoc
    name: bashcoat
