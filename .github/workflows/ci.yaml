name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_code_changed: ${{ steps.filter.outputs.has_code_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "has_code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          elif [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              changed_files="$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER")"
            else
              echo "has_code_changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "has_code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$changed_files"

          has_code_changed="false"
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              cmd/*|internal/*|examples/*|go.mod|go.sum|.golangci.yaml|.github/workflows/ci.yaml)
                has_code_changed="true"
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "has_code_changed=${has_code_changed}" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.has_code_changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Bash 5+ and Bats on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash bats-core
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Install Bats on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run unit tests with race detector
        run: go test -v -race ./...

  lint:
    name: Lint & Security Scan
    needs: changes
    if: needs.changes.outputs.has_code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
