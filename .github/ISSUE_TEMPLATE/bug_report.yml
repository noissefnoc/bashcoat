name: Bug Report
description: Report a bug or unexpected behavior in bashcoat
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please note that `bashcoat` is maintained on a best-effort basis and requires **Bash 5.0 or newer**.
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checks
      options:
        - label: I confirmed the runtime Bash version is 5.0 or newer.
          required: true
        - label: I checked the [Known Limitations (v1)](https://github.com/noissefnoc/bashcoat#known-limitations-v1) section in `README.md`.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what happened vs. what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Please share the minimal Bash script and `bashcoat` command that reproduce the issue.
      placeholder: |
        ```bash
        bashcoat -t script.sh -- ./test.sh
        ```
    validations:
      required: true
  - type: input
    id: bashcoat_version
    attributes:
      label: bashcoat version
      description: Output of `bashcoat -v`
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: input
    id: bash_version
    attributes:
      label: Bash version
      description: Output of `bash --version`
      placeholder: "GNU bash, version 5.2.37(1)-release"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output / LCOV snippet
      description: Any relevant stderr output or generated LCOV lines.
      render: text
